name: Audit Wizard image URLs
on:
  push:
    paths:
      - '.github/workflows/audit-wizard-images.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact product image candidates
        shell: bash
        run: |
          node <<'NODE'
          const https=require('https'),http=require('http');
          const pages={
            kindle_pw_12:'https://maydocsachtot.com/san-pham/kindle-paperwhite-6/',
            kindle_pw_se_12:'https://maydocsachtot.com/san-pham/kindle-paperwhite-6-signature-edition-32gb/',
            kindle_scribe_2022:'https://www.kindlescribe.vn/san-pham/kindle-scribe-2022/',
            kindle_scribe_2024:'https://www.kindlescribe.vn/san-pham/kindle-scribe-2024/',
            kindle_scribe_3_nolight:'https://www.kindlescribe.vn/san-pham/kindle-scribe-3-khong-den/',
            kobo_sage:'https://ereader.kobo.com/en-us/products/kobo-sage'
          };
          function get(url,redirects=0){return new Promise(resolve=>{
            const u=new URL(url),lib=u.protocol==='https:'?https:http;
            const req=lib.get(u,{headers:{'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'},timeout:15000},res=>{
              if([301,302,303,307,308].includes(res.statusCode)&&res.headers.location&&redirects<5){
                const n=new URL(res.headers.location,u).href;res.resume();return get(n,redirects+1).then(resolve);
              }
              const a=[];let n=0;res.on('data',c=>{if(n<4000000)a.push(c);n+=c.length});
              res.on('end',()=>resolve({status:res.statusCode||0,url:u.href,body:Buffer.concat(a).toString('utf8')}));
            });req.on('timeout',()=>req.destroy());req.on('error',()=>resolve({status:0,url,body:''}));
          })}
          function urls(html,base){
            const out=[];
            for(const m of html.matchAll(/(?:src|data-src|data-large_image|href)=["']([^"']+\.(?:png|jpe?g|webp)(?:\?[^"']*)?)["']/ig)){
              try{const u=new URL(m[1].replace(/&amp;/g,'&'),base).href;if(!out.includes(u))out.push(u)}catch{}
            }
            return out.filter(u=>!/(logo|icon|avatar|payment|banner|footer|header|favicon|emoji)/i.test(u));
          }
          (async()=>{
            for(const [id,page] of Object.entries(pages)){
              const r=await get(page);
              console.log('\n### '+id+' PAGE_STATUS='+r.status+' PAGE='+r.url);
              urls(r.body,r.url).slice(0,30).forEach(u=>console.log(u));
            }
          })();
          NODE
