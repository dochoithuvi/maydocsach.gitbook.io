<body>
<!-- PATCH PLACEHOLDER -->
<script>
function scheduleResize(){
  const mobile = window.matchMedia && window.matchMedia('(max-width: 720px)').matches;
  const resultsVisible = document.getElementById('results')?.style.display === 'block';
  const state = (mobile ? 'm' : 'd') + (resultsVisible ? 'r' : 'f');
  if (window.__wizardResizeState === state) return;
  window.__wizardResizeState = state;
  sendResize();
}
</script>
</body>
</html>
