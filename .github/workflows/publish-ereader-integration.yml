name: Publish MayDocSach E-Reader Integration

# Automation check: publishing is triggered by changes under integration/** or this workflow (token recheck).
on:
  push:
    branches:
      - main
    paths:
      - "integration/**"
      - ".github/workflows/publish-ereader-integration.yml"
  workflow_dispatch:

concurrency:
  group: publish-ereader-integration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install integration dependencies
        working-directory: integration
        run: npm install --no-audit --no-fund

      - name: Install GitBook CLI
        run: npm install --global @gitbook/cli

      - name: Validate integration
        working-directory: integration
        run: npm run build

      - name: Authenticate GitBook
        env:
          GITBOOK_API_TOKEN: ${{ secrets.GITBOOK_API_TOKEN }}
        run: |
          if [ -z "$GITBOOK_API_TOKEN" ]; then
            echo "::error::Missing repository secret GITBOOK_API_TOKEN"
            exit 1
          fi
          # GitBook's API may temporarily return 5xx during authentication.
          # Retry so a transient control-plane error does not block publishing.
          for attempt in 1 2 3 4 5; do
            echo "GitBook authentication attempt ${attempt}/5"
            if gitbook auth --token="$GITBOOK_API_TOKEN"; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 5))
              echo "GitBook authentication failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "::error::GitBook authentication failed after 5 attempts."
          exit 1

      - name: Publish integration
        working-directory: integration
        run: npm run publish:gitbook
